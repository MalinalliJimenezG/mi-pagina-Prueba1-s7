<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .contenedor { background: #1b232e !important; border-color: #2b3644 !important; }
    .pestanas { border-bottom-color: #2b3644 !important; }
    .pestana { color: #9fb0c2 !important; }
    .pestana.activa { color: #e8eef5 !important; border-bottom-color: #6ea0e8 !important; }
    .propuesta { background: #202a37 !important; border-color: #364656 !important; }
    .vacio { color: #9fb0c2 !important; }
    input, textarea { background: #202a37 !important; border-color: #364656 !important; color: #e8eef5 !important; }
  }
  .contenedor {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: 32px; width: 100%; max-width: 560px; box-sizing: border-box;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
  }
  header h1 {
    font-size: clamp(22px, 5vw, 28px);
    margin: 0 0 10px;
    text-align: center;
  }
  .explicacion {
    margin: 0 0 24px;
    line-height: 1.55;
    text-align: center;
    color: inherit;
    opacity: .85;
  }
  .pestanas {
    display: flex;
    border-bottom: 1px solid #dde3ea;
    margin-bottom: 20px;
  }
  .pestana {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 6px;
    font-size: 15px;
    font-family: inherit;
    color: #6b7684;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .pestana.activa {
    color: #1a2027;
    border-bottom-color: #2b6fe0;
    font-weight: 600;
  }
  .vista { display: none; }
  .vista.activa { display: block; }
  .vacio {
    border: 2px dashed #c3cdd8;
    border-radius: 10px;
    padding: 28px 16px;
    text-align: center;
    color: #6b7684;
    font-size: 14px;
  }
  .lista-propuestas {
    list-style: none;
    margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .propuesta {
    border: 1px solid #dde3ea;
    border-radius: 10px;
    padding: 14px 16px;
    background: #f9fafb;
  }
  .propuesta h3 {
    margin: 0 0 4px;
    font-size: 16px;
  }
  .propuesta .quien {
    font-size: 13px;
    opacity: .7;
    margin: 0 0 8px;
  }
  .propuesta .justificacion {
    margin: 0 0 10px;
    font-size: 14px;
    line-height: 1.45;
  }
  .votacion {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .votacion button {
    border: 1px solid #c3cdd8;
    background: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .votacion button:disabled {
    opacity: .5;
    cursor: default;
  }
  .votacion .ya-votada {
    color: #2b6fe0;
    font-weight: 600;
  }
  .aviso {
    margin: 0 0 16px;
    font-size: 14px;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .aviso.error {
    background: #fdeceb;
    color: #a23b32;
  }
  @media (prefers-color-scheme: dark) {
    .aviso.error { background: #3a2320 !important; color: #f2a99e !important; }
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
  }
  input, textarea {
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #c3cdd8;
    border-radius: 8px;
    box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 70px; }
  form button[type="submit"] {
    align-self: flex-start;
    background: #2b6fe0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Buzón de sugerencias</h1>
    </header>
    <p class="explicacion">
      Este espacio es para dejar ideas, comentarios o quejas sobre lo que
      se pueda mejorar. Cualquier persona puede escribir la suya.
    </p>

    <div class="pestanas" role="tablist">
      <button class="pestana activa" id="tab-propuestas" role="tab" aria-selected="true" aria-controls="vista-propuestas">
        Lugares propuestos
      </button>
      <button class="pestana" id="tab-proponer" role="tab" aria-selected="false" aria-controls="vista-proponer">
        Proponer un lugar
      </button>
    </div>

    <section class="vista activa" id="vista-propuestas" role="tabpanel" aria-labelledby="tab-propuestas">
      <p class="aviso error" id="aviso-propuestas" hidden></p>
      <ul class="lista-propuestas" id="lista-propuestas" hidden></ul>
      <p class="vacio" id="mensaje-vacio">
        Todavía no hay propuestas de lugares para la cena de fin de año.
      </p>
    </section>

    <section class="vista" id="vista-proponer" role="tabpanel" aria-labelledby="tab-proponer">
      <p class="explicacion" style="margin-bottom:16px;">
        Propón un lugar para la cena de fin de año.
      </p>
      <p class="aviso error" id="aviso-form" hidden></p>
      <form id="form-propuesta">
        <label>
          Nombre del lugar
          <input type="text" name="lugar" required>
        </label>
        <label>
          Tu nombre
          <input type="text" name="persona" required>
        </label>
        <label>
          Breve justificación
          <textarea name="justificacion" required></textarea>
        </label>
        <button type="submit">Enviar propuesta</button>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const tabPropuestas = document.getElementById('tab-propuestas');
    const tabProponer = document.getElementById('tab-proponer');
    const vistaPropuestas = document.getElementById('vista-propuestas');
    const vistaProponer = document.getElementById('vista-proponer');

    function mostrarVista(tab, vista, otroTab, otraVista) {
      tab.classList.add('activa');
      tab.setAttribute('aria-selected', 'true');
      vista.classList.add('activa');
      otroTab.classList.remove('activa');
      otroTab.setAttribute('aria-selected', 'false');
      otraVista.classList.remove('activa');
    }

    tabPropuestas.addEventListener('click', () => {
      mostrarVista(tabPropuestas, vistaPropuestas, tabProponer, vistaProponer);
    });
    tabProponer.addEventListener('click', () => {
      mostrarVista(tabProponer, vistaProponer, tabPropuestas, vistaPropuestas);
    });

    const SUPABASE_URL = 'https://byczuywogxjqivtqvoha.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6EB49bOLVKbSDWmFEaXrig_iEdqQSsq';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function obtenerElectorId() {
      let id = localStorage.getItem('elector_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('elector_id', id);
      }
      return id;
    }

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    function mostrarAviso(elemento, mensaje) {
      elemento.textContent = mensaje;
      elemento.hidden = !mensaje;
    }

    const listaPropuestas = document.getElementById('lista-propuestas');
    const mensajeVacio = document.getElementById('mensaje-vacio');
    const avisoPropuestas = document.getElementById('aviso-propuestas');

    async function cargarPropuestas() {
      mostrarAviso(avisoPropuestas, '');

      const [{ data: propuestas, error: errorPropuestas }, { data: votos, error: errorVotos }] =
        await Promise.all([
          db.from('propuestas_cena').select('*').order('creado_en', { ascending: true }),
          db.from('votos_cena').select('propuesta_id, elector_id'),
        ]);

      if (errorPropuestas || errorVotos) {
        mostrarAviso(avisoPropuestas, 'No se pudieron cargar las propuestas. Intenta recargar la página.');
        return;
      }

      const conteoVotos = {};
      votos.forEach((v) => {
        conteoVotos[v.propuesta_id] = (conteoVotos[v.propuesta_id] || 0) + 1;
      });

      const electorId = obtenerElectorId();
      const votoDeEsteElector = votos.find((v) => v.elector_id === electorId);
      const propuestaVotada = votoDeEsteElector ? votoDeEsteElector.propuesta_id : null;

      if (!propuestas.length) {
        listaPropuestas.hidden = true;
        mensajeVacio.hidden = false;
        listaPropuestas.innerHTML = '';
        return;
      }

      mensajeVacio.hidden = true;
      listaPropuestas.hidden = false;
      listaPropuestas.innerHTML = propuestas.map((p) => {
        const votos = conteoVotos[p.id] || 0;
        const yaVoto = propuestaVotada !== null;
        const esLaVotada = propuestaVotada === p.id;
        let controlVoto;
        if (esLaVotada) {
          controlVoto = '<span class="ya-votada">Tu voto</span>';
        } else if (yaVoto) {
          controlVoto = '<button type="button" disabled>Votar</button>';
        } else {
          controlVoto = `<button type="button" class="boton-votar" data-id="${p.id}">Votar</button>`;
        }
        return `
          <li class="propuesta">
            <h3>${escaparHtml(p.lugar)}</h3>
            <p class="quien">Propuesto por ${escaparHtml(p.persona)}</p>
            <p class="justificacion">${escaparHtml(p.justificacion)}</p>
            <div class="votacion">
              <span>${votos} ${votos === 1 ? 'voto' : 'votos'}</span>
              ${controlVoto}
            </div>
          </li>
        `;
      }).join('');

      listaPropuestas.querySelectorAll('.boton-votar').forEach((boton) => {
        boton.addEventListener('click', () => votar(boton.dataset.id));
      });
    }

    async function votar(propuestaId) {
      const electorId = obtenerElectorId();
      const { error } = await db.from('votos_cena').insert({
        propuesta_id: propuestaId,
        elector_id: electorId,
      });
      if (error) {
        mostrarAviso(avisoPropuestas, 'Ya habías votado o hubo un problema al registrar tu voto.');
        return;
      }
      cargarPropuestas();
    }

    const formPropuesta = document.getElementById('form-propuesta');
    const avisoForm = document.getElementById('aviso-form');

    formPropuesta.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrarAviso(avisoForm, '');

      const datos = new FormData(formPropuesta);
      const lugar = datos.get('lugar').trim();
      const persona = datos.get('persona').trim();
      const justificacion = datos.get('justificacion').trim();

      const { error } = await db.from('propuestas_cena').insert({ lugar, persona, justificacion });

      if (error) {
        mostrarAviso(avisoForm, 'No se pudo enviar la propuesta. Intenta de nuevo.');
        return;
      }

      formPropuesta.reset();
      mostrarVista(tabPropuestas, vistaPropuestas, tabProponer, vistaProponer);
      cargarPropuestas();
    });

    cargarPropuestas();
  </script>
</body>
</html>
